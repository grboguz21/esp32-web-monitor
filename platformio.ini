; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; secrets.ini holds the Wi-Fi update password (copy secrets.ini.example)
[platformio]
extra_configs = secrets.ini

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 460800
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
build_flags =
    '-DOTA_PASSWORD="${secrets.ota_password}"'
lib_deps =
    adafruit/Adafruit INA219@^1.2.3
    madhephaestus/ESP32Encoder@^0.11.7
    links2004/WebSockets@^2.7.3
    adafruit/Adafruit BNO055@^1.6.4

; Same firmware, uploaded over Wi-Fi: pio run -e ota -t upload
; The board's address on the phone hotspot (.local names do not resolve there).
; host_port is where the board connects back to this PC; the firewall has to let it in.
[env:ota]
extends = env:nodemcu-32s
upload_protocol = espota
upload_port = 172.20.10.11
upload_flags =
    --port=3232
    --auth=${secrets.ota_password}
    --host_port=40000
    --progress
